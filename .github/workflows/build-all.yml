name: Build all

on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:
    branches: [main]

jobs:
  build-all:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup base
        id: base
        uses: ./.github/actions/setup

      - uses: actions/cache@v6
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Build project
        run: |
          cd platform.io
          pio run

      - name: Sign firmware
        run: |
          mkdir firmware
          cd firmware
          python ../tools/sign.py

      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: radpro-firmware-snapshot
          overwrite: true
          path: firmware/*
